  header,#bannerWrap,nav,main{position:relative}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 28px 8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:60px;height:60px;display:block}
  h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
  .right{display:flex;align-items:center;gap:10px}
  .clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .date{color:var(--muted);font-size:1rem;text-align:right}
  .langs{display:flex;gap:4px}
  .langs button{border:0;background:var(--panel);color:var(--muted);font:inherit;font-weight:700;font-size:.9rem;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:44px}
  .langs button.active{background:var(--panel2);color:var(--cyan)}
  .gear{background:var(--panel);border:0;color:var(--text);font:inherit;font-weight:700;font-size:.95rem;padding:10px 16px;cursor:pointer;border-radius:12px;min-height:44px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .banner{margin:6px 28px 0;display:inline-block;background:var(--cyan);color:var(--cyan-ink);font-weight:800;padding:8px 18px;border-radius:999px}
  nav{display:flex;gap:10px;padding:12px 28px;overflow-x:auto}
  nav button{flex:0 0 auto;border:0;border-radius:var(--radius);padding:16px 24px;background:var(--panel);
    color:var(--text);font:inherit;font-weight:700;cursor:pointer;min-height:58px}
  nav button.active{background:var(--cyan);color:var(--cyan-ink)}
  main{padding:8px 28px 40px;max-width:1100px;margin:0 auto}
  .hint{color:var(--muted);margin:4px 0 18px;max-width:70ch}
  .hero{background:var(--cyan);color:#050504;border-radius:var(--radius);padding:18px 24px;display:flex;align-items:center;gap:22px;margin-bottom:18px}
  .hero img{height:88px;width:auto;display:block}
  .hero p{margin:0;font-weight:700;font-size:1.25rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .slot{border:0;border-radius:var(--radius);padding:18px 16px;min-height:96px;text-align:left;font:inherit;
    display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .slot .t{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
  .slot .s{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
  .slot.free{background:var(--cyan);color:var(--cyan-ink);cursor:pointer}
  .slot.busy{background:var(--busy);color:var(--busy-ink);cursor:default}
  .slot.past{background:var(--past);color:var(--past-ink);cursor:default}
  .slot.now{box-shadow:0 0 0 4px var(--bg),0 0 0 8px #fff}
  .overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--panel);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:10px}
  .card h2{margin:0;font-size:1.4rem}
  .card .big{font-size:1.1rem}
  .badge{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;width:fit-content}
  .badge.free{background:var(--cyan);color:var(--cyan-ink)}
  .badge.busy{background:var(--busy);color:var(--busy-ink)}
  .card button{margin-top:6px;border:0;border-radius:14px;padding:14px;background:var(--panel2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;min-height:52px}
  .overlay{position:fixed;inset:0;background:rgba(5,5,4,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal{background:var(--panel);border-radius:24px;padding:28px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px}
  .modal h3{margin:0;font-size:1.5rem}
  .modal p{margin:0;color:var(--muted)}
  .modal p.note{color:var(--cyan)}
  .err{color:var(--busy);min-height:1.3em;font-weight:500}
  input[type=text],input[type=password],input[type=number],input[type=time],select{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--panel2);border-radius:14px;padding:14px 16px;width:100%;min-height:54px}
  .row{display:flex;gap:10px}
  .btn{border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;min-height:54px;flex:1}
  .btn.primary{background:var(--cyan);color:var(--cyan-ink)}
  .btn.danger{background:var(--busy);color:var(--busy-ink)}
  .btn.ghost{background:var(--panel2);color:var(--text)}
  .admin section{background:var(--panel);border-radius:var(--radius);padding:22px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
  .admin h2{margin:0 0 2px;font-size:1.3rem}
  .admin h4{margin:8px 0 0;font-size:1.05rem;color:var(--muted)}
  .admin label.f{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.95rem}
  .check{display:flex;align-items:center;gap:12px;min-height:44px;color:var(--text)}
  .check input{width:26px;height:26px;accent-color:var(--cyan)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg button{border:0;border-radius:var(--radius);padding:18px;background:var(--panel2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-align:left;min-height:84px}
  .seg button small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
  .seg button.active{background:var(--cyan);color:var(--cyan-ink)}
  .seg button.active small{color:#0b4e52}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:10px}
  .item .txt{flex:1;overflow-wrap:anywhere;padding-left:6px}
  .item input{flex:1;min-width:0}
  .item .btn{flex:0 0 auto;padding:10px 18px;min-height:46px}
  .item.dim input{opacity:.55}
  .tag{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--cyan);color:var(--cyan-ink);
    padding:14px 24px;border-radius:999px;font-weight:700;z-index:20;max-width:90%;text-align:center}
  @media (max-width:700px){.seg,.two,.three{grid-template-columns:1fr} h1{font-size:1.5rem} .clock{font-size:1.5rem} .hero{flex-direction:column;align-items:flex-start}}
  @media (prefers-reduced-motion:no-preference){.overlay{animation:fade .15s ease-out}@keyframes fade{from{opacity:0}}}
</style>

  /* ---------- tila ---------- */
  var DEFAULTS = {
    cfg:{
      session:"afternoon", password:"1234", maxPerPerson:2, hidePast:true,
      sessions:{
        afternoon:{open:"13:00", close:"16:30", len:20},
        evening:{open:"17:00", close:"21:00", len:30}
      },
      consoles:[
        {id:"ps5",name:"PS5",hidden:false},
        {id:"sw2",name:"Switch 2",hidden:false},
        {id:"sw1",name:"Switch #1",hidden:false},
        {id:"sw3",name:"Switch #2",hidden:false},
        {id:"sim",name:"Ajosimulaattori",hidden:false}
      ]
    },
    res:{}, lang:"fi"
  };
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function load(){
    var out = clone(DEFAULTS);
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(d.cfg){
          Object.keys(out.cfg).forEach(function(k){ if(d.cfg[k] !== undefined && k!=="sessions") out.cfg[k] = d.cfg[k]; });
          SESSION_ORDER.forEach(function(s){ if(d.cfg.sessions && d.cfg.sessions[s]) Object.assign(out.cfg.sessions[s], d.cfg.sessions[s]); });
        }
        out.res = d.res || {};
        if(T[d.lang]) out.lang = d.lang;
      }
    }catch(e){}
    return out;
  }
  var state = load();
  var ui = { tab:"overview", leader:false };

  function t(key, vars){
    var s = (T[state.lang][key] !== undefined) ? T[state.lang][key] : T.fi[key];
    if(vars) Object.keys(vars).forEach(function(k){ s = s.replace("{"+k+"}", vars[k]); });
    return s;
  }
  function save(){
    var keys = Object.keys(state.res).sort();
    while(keys.length > 7){ delete state.res[keys.shift()]; }
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast(t("storageErr")); }
  }

  /* ---------- apufunktiot ---------- */
  function todayKey(){ return new Date().toLocaleDateString("sv-SE"); }
  function toMin(s){ var p = String(s).split(":"); return (+p[0])*60 + (+p[1]); }
  function fmt(m){ var h = Math.floor(m/60), mm = m%60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
  function nowMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function S(sess){ var c = state.cfg.sessions[sess]; return {open:toMin(c.open), close:toMin(c.close), len:+c.len}; }
  function slotsOf(sess){
    var s = S(sess), out = [];
    for(var x=s.open; x+s.len<=s.close; x+=s.len) out.push({start:x, end:x+s.len});
    return out;
  }
  function sessRange(sess){ var s = S(sess); return fmt(s.open)+"–"+fmt(s.close); }
  function consoles(){ return state.cfg.consoles; }
  function visible(){ return consoles().filter(function(c){ return !c.hidden; }); }
  function byId(id){ return consoles().filter(function(c){ return c.id===id; })[0]; }
  function cname(cid){ var c = byId(cid); return c ? c.name : "?"; }
  function dayRes(sess, cid){
    var k = todayKey();
    if(!state.res[k]) state.res[k] = {};
    if(!state.res[k][sess]) state.res[k][sess] = {};
    if(cid && !state.res[k][sess][cid]) state.res[k][sess][cid] = {};
    return cid ? state.res[k][sess][cid] : state.res[k][sess];
  }
  function getBooking(sess, cid, start){ return dayRes(sess, cid)[start]; }
  function isPast(sl){ return state.cfg.hidePast && sl.end <= nowMin(); }

  function el(tag, props, kids){
    var n = document.createElement(tag);
    Object.keys(props||{}).forEach(function(k){
      if(k==="class") n.className = props[k];
      else if(k==="text") n.textContent = props[k];
      else if(k.indexOf("on")===0) n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    });
    (kids||[]).forEach(function(c){ if(c) n.appendChild(c); });
    return n;
  }
  function toast(msg){
    var x = el("div",{class:"toast",role:"status",text:msg});
    document.body.appendChild(x);
    setTimeout(function(){ x.remove(); }, 3000);
  }

  /* ---------- modal ---------- */
  function modal(o){
    var err = el("div",{class:"err",role:"alert"}), input = null;
    var kids = [el("h3",{text:o.title})];
    if(o.text) kids.push(el("p",{text:o.text}));
    if(o.input){
      input = el("input",{type:o.input.type||"text",placeholder:o.input.placeholder||"",maxlength:o.input.max||24,
        autocomplete:"off",autocapitalize:o.input.cap||"words","aria-label":o.input.placeholder||o.title});
      kids.push(input);
    }
    if(o.note) kids.push(el("p",{class:"note",text:o.note}));
    kids.push(err);
    var overlay = el("div",{class:"overlay"});
    function close(){ overlay.remove(); }
    function submit(){
      var r = o.onOk(input ? input.value.trim() : null);
      if(typeof r === "string"){ err.textContent = r; return; }
      close();
    }
    kids.push(el("div",{class:"row"},[
      el("button",{class:"btn ghost",text:t("back"),onclick:close}),
      el("button",{class:"btn "+(o.danger?"danger":"primary"),text:o.okLabel,onclick:submit})
    ]));
    overlay.appendChild(el("div",{class:"modal",role:"dialog","aria-modal":"true"},kids));
    overlay.addEventListener("click",function(e){ if(e.target===overlay) close(); });
    document.body.appendChild(overlay);
    if(input){
      input.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
      setTimeout(function(){ input.focus(); }, 50);
    }
  }

  /* ---------- varaus ---------- */
  function countFor(sess, name){
    var n = 0, all = dayRes(sess), len = S(sess).len;
    Object.keys(all).forEach(function(cid){
      Object.keys(all[cid]).forEach(function(s){
        var ended = state.cfg.hidePast && (+s)+len <= nowMin();
        if(all[cid][s].toLowerCase()===name.toLowerCase() && !ended) n++;
      });
    });
    return n;
  }
  function book(sess, cid, sl){
    modal({
      title:t("bookTitle",{a:fmt(sl.start),b:fmt(sl.end)}),
      text:cname(cid)+" · "+t("yourName"),
      input:{placeholder:t("namePh")},
      note:t("bookWarn"),
      okLabel:t("confirm"),
      onOk:function(name){
        if(!name) return t("needName");
        if(getBooking(sess,cid,sl.start)) return t("taken");
        var max = +state.cfg.maxPerPerson;
        if(max > 0 && countFor(sess,name) >= max) return t("limit",{n:max});
        dayRes(sess,cid)[sl.start] = name;
        save(); render();
        toast(t("booked",{n:name,c:cname(cid),t:fmt(sl.start)}));
      }
    });
  }

  /* ---------- nuorten näkymät ---------- */
  function renderTabs(){
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    if(ui.leader) return;
    var items = [{id:"overview",name:t("overview")}].concat(visible().map(function(c){ return {id:c.id,name:c.name}; }));
    items.forEach(function(it){
      var b = el("button",{text:it.name,onclick:function(){ ui.tab = it.id; render(); }});
      if(ui.tab===it.id) b.className = "active";
      nav.appendChild(b);
    });
  }

  function renderOverview(view){
    var sess = state.cfg.session, all = slotsOf(sess), now = nowMin(), rng = S(sess);
    view.appendChild(el("div",{class:"hero"},[
      el("img",{src:LOGO_WORD,alt:"SideQuest"}),
      el("p",{text:t("hintOverview")})
    ]));
    if(!visible().length){ view.appendChild(el("p",{class:"hint",text:t("noConsoles")})); return; }
    var wrap = el("div",{class:"overview"});
    visible().forEach(function(c){
      var cid = c.id;
      var cur = all.filter(function(s){ return now>=s.start && now<s.end; })[0];
      var who = cur ? getBooking(sess,cid,cur.start) : null;
      var next = all.filter(function(s){ return s.end>now && !getBooking(sess,cid,s.start) && !(cur && s.start===cur.start); })[0];
      var kids = [el("h2",{text:c.name})];
      if(now < rng.open) kids.push(el("div",{class:"big",text:t("opensAt",{t:fmt(rng.open)})}));
      else if(now >= rng.close) kids.push(el("div",{class:"big",text:t("closed")}));
      else{
        kids.push(who ? el("span",{class:"badge busy",text:t("playingNow",{n:who})}) : el("span",{class:"badge free",text:t("freeNow")}));
        kids.push(el("div",{class:"big",text: next ? t("nextFree",{t:fmt(next.start)}) : t("noMore")}));
      }
      kids.push(el("button",{text:t("showSlots"),onclick:function(){ ui.tab=cid; render(); }}));
      wrap.appendChild(el("div",{class:"card"},kids));
    });
    view.appendChild(wrap);
  }

  function renderConsole(view, cid){
    var sess = state.cfg.session, now = nowMin();
    view.appendChild(el("h2",{text:cname(cid),style:"margin:0 0 4px"}));
    var max = +state.cfg.maxPerPerson;
    view.appendChild(el("p",{class:"hint",text:t("hintConsole",{n:max>0?max:"∞"})}));
    var grid = el("div",{class:"grid"});
    slotsOf(sess).forEach(function(sl){
      var who = getBooking(sess,cid,sl.start), past = isPast(sl), isNow = now>=sl.start && now<sl.end;
      var cls = "slot " + (past ? "past" : who ? "busy" : "free") + (isNow ? " now" : "");
      var label = who ? (past ? t("ended",{n:who}) : who) : (past ? t("past") : t("free"));
      var b = el("button",{class:cls},[
        el("span",{class:"t",text:fmt(sl.start)+"–"+fmt(sl.end)}),
        el("span",{class:"s",text:label})
      ]);
      if(who || past){ b.disabled = true; b.setAttribute("aria-disabled","true"); }
      else b.addEventListener("click",function(){ book(sess,cid,sl); });
      grid.appendChild(b);
    });
    view.appendChild(grid);
  }

  /* ---------- ohjaajan näkymä ---------- */
  function renderLeader(view){
    var cfg = state.cfg, wrap = el("div",{class:"admin"});
    wrap.appendChild(el("h2",{text:t("panel"),style:"font-size:1.6rem;margin:0 0 14px"}));

    // 1. Jakso
    var seg = el("div",{class:"seg"});
    SESSION_ORDER.forEach(function(s){
      var b = el("button",{onclick:function(){ cfg.session = s; save(); render(); }},[
        el("span",{text:t("s_"+s)}),
        el("small",{text:sessRange(s)+" · "+S(s).len+" "+t("min")})
      ]);
      if(cfg.session===s) b.className = "active";
      seg.appendChild(b);
    });
    wrap.appendChild(el("section",{},[el("h2",{text:t("sessionH")}), el("p",{class:"hint",style:"margin:0",text:t("sessionHint")}), seg]));

    // 2. Laitteet
    var sC = el("section",{},[el("h2",{text:t("consolesH")}), el("p",{class:"hint",style:"margin:0",text:t("consolesHint")})]);
    consoles().forEach(function(c, i){
      var inp = el("input",{type:"text",value:c.name,maxlength:"30","aria-label":t("consolesH")+" "+(i+1)});
      inp.addEventListener("change",function(){ c.name = inp.value.trim() || c.name; inp.value = c.name; save(); toast(t("saved")); });
      var row = el("div",{class:"item"+(c.hidden?" dim":"")},[
        inp,
        c.hidden ? el("span",{class:"tag",text:t("hiddenTag")}) : null,
        el("button",{class:"btn ghost",text:c.hidden?t("show"):t("hide"),onclick:function(){ c.hidden = !c.hidden; save(); render(); }}),
        el("button",{class:"btn danger",text:t("remove"),onclick:function(){
          modal({title:t("rmConsoleTitle",{n:c.name}),text:t("rmConsoleText"),okLabel:t("rmConsoleOk"),danger:true,onOk:function(){
            cfg.consoles = cfg.consoles.filter(function(x){ return x.id!==c.id; });
            var day = state.res[todayKey()];
            if(day) Object.keys(day).forEach(function(s){ delete day[s][c.id]; });
            save(); render();
          }});
        }})
      ]);
      sC.appendChild(row);
    });
    sC.appendChild(el("button",{class:"btn ghost",style:"flex:none",text:"+ "+t("addConsole"),onclick:function(){
      cfg.consoles.push({id:"c"+Date.now(), name:t("newConsole"), hidden:false}); save(); render();
    }}));
    wrap.appendChild(sC);

    // 3. Varaukset
    var sB = el("section",{},[el("h2",{text:t("bookingsH")})]);
    var any = false;
    SESSION_ORDER.forEach(function(s){
      var rows = [], len = S(s).len;
      consoles().forEach(function(c){
        var r = dayRes(s,c.id);
        Object.keys(r).map(Number).sort(function(a,b){return a-b;}).forEach(function(st){
          rows.push({cid:c.id, start:st, end:st+len, name:r[st]});
        });
      });
      if(!rows.length) return;
      any = true;
      sB.appendChild(el("h4",{text:t("s_"+s)+" · "+sessRange(s)}));
      rows.forEach(function(row){
        var when = fmt(row.start)+"–"+fmt(row.end);
        sB.appendChild(el("div",{class:"item"},[
          el("div",{class:"txt",text:when+" · "+cname(row.cid)+" · "+row.name}),
          el("button",{class:"btn danger",text:t("remove"),onclick:function(){
            modal({title:t("removeTitle"),text:t("removeText",{n:row.name,c:cname(row.cid),t:when}),okLabel:t("removeOk"),danger:true,
              onOk:function(){ delete dayRes(s,row.cid)[row.start]; save(); render(); toast(t("removed")); }});
          }})
        ]));
      });
    });
    if(!any) sB.appendChild(el("p",{class:"hint",style:"margin:0",text:t("noBookings")}));
    wrap.appendChild(sB);

    // 4. Ajat
    var sT = el("section",{},[el("h2",{text:t("timesH")})]);
    SESSION_ORDER.forEach(function(s){
      var c = cfg.sessions[s];
      var o = el("input",{type:"time",value:c.open,"aria-label":t("starts")});
      var e = el("input",{type:"time",value:c.close,"aria-label":t("ends")});
      var l = el("select",{"aria-label":t("slotLen")}, LENGTHS.map(function(v){ return el("option",{value:String(v),text:v+" "+t("min")}); }));
      l.value = String(c.len);
      function apply(){
        if(!o.value || !e.value || toMin(e.value) <= toMin(o.value)){ toast(t("timeErr")); o.value = c.open; e.value = c.close; return; }
        c.open = o.value; c.close = e.value; c.len = +l.value;
        save(); toast(t("saved"));
      }
      [o,e,l].forEach(function(x){ x.addEventListener("change",apply); });
      sT.appendChild(el("h4",{text:t("s_"+s)}));
      sT.appendChild(el("div",{class:"three"},[
        el("label",{class:"f"},[el("span",{text:t("starts")}), o]),
        el("label",{class:"f"},[el("span",{text:t("ends")}), e]),
        el("label",{class:"f"},[el("span",{text:t("slotLen")}), l])
      ]));
    });
    wrap.appendChild(sT);

    // 5. Asetukset
    var chk = el("input",{type:"checkbox"}); chk.checked = !!cfg.hidePast;
    chk.addEventListener("change",function(){ cfg.hidePast = chk.checked; save(); toast(t("saved")); });
    var num = el("input",{type:"number",min:"0",max:"10",value:String(cfg.maxPerPerson)});
    num.addEventListener("change",function(){ var v = Math.max(0,Math.min(10,parseInt(num.value,10)||0)); num.value = v; cfg.maxPerPerson = v; save(); toast(t("saved")); });
    wrap.appendChild(el("section",{},[
      el("h2",{text:t("optionsH")}),
      el("label",{class:"check"},[chk, el("span",{text:t("hidePast")})]),
      el("label",{class:"f"},[el("span",{text:t("maxPer")+" (0 = ∞)"}), num])
    ]));

    // 6. Uusi päivä
    wrap.appendChild(el("section",{},[
      el("h2",{text:t("clearH")}),
      el("button",{class:"btn danger",style:"flex:none",text:t("clearBtn"),onclick:function(){
        modal({title:t("clearTitle"),text:t("clearText"),okLabel:t("clearOk"),danger:true,onOk:function(){
          state.res = {}; save(); render(); toast(t("cleared"));
        }});
      }})
    ]));

    // 7. Salasana
    var pw = el("input",{type:"text",placeholder:t("newPass"),maxlength:"30",autocomplete:"off","aria-label":t("newPass")});
    pw.addEventListener("change",function(){
      var v = pw.value.trim();
      if(v.length<4){ toast(t("passShort")); return; }
      cfg.password = v; pw.value = ""; save(); toast(t("saved"));
    });
    wrap.appendChild(el("section",{},[el("h2",{text:t("passH")}), pw]));

    wrap.appendChild(el("button",{class:"btn primary",text:t("done"),style:"width:100%;flex:none",onclick:function(){ ui.leader=false; ui.tab="overview"; render(); }}));
    view.appendChild(wrap);
  }

  /* ---------- yleinen ---------- */
  function renderStatic(){
    document.documentElement.lang = state.lang;
    document.getElementById("title").textContent = t("title");
    document.getElementById("gear").textContent = t("leader");
    var lw = document.getElementById("langs");
    lw.innerHTML = "";
    [["fi","FI"],["sv","SV"],["en","EN"]].forEach(function(p){
      var b = el("button",{text:p[1],"aria-label":p[1],onclick:function(){ state.lang=p[0]; save(); tick(); render(); }});
      if(state.lang===p[0]) b.className = "active";
      lw.appendChild(b);
    });
    var bw = document.getElementById("bannerWrap");
    bw.innerHTML = "";
    if(!ui.leader){
      var s = state.cfg.session;
      bw.appendChild(el("div",{class:"banner",text:t("s_"+s)+" · "+sessRange(s)}));
    }
  }

  function render(){
    if(ui.tab!=="overview" && !visible().some(function(c){ return c.id===ui.tab; })) ui.tab = "overview";
    renderStatic();
    renderTabs();
    var view = document.getElementById("view");
    view.innerHTML = "";
    if(ui.leader) renderLeader(view);
    else if(ui.tab==="overview") renderOverview(view);
    else renderConsole(view, ui.tab);
  }

  function tick(){
    var d = new Date();
    document.getElementById("clock").textContent = fmt(d.getHours()*60+d.getMinutes());
    document.getElementById("date").textContent = d.toLocaleDateString(t("locale"),{weekday:"long",day:"numeric",month:"long"});
  }

  document.getElementById("gear").addEventListener("click",function(){
    if(ui.leader){ ui.leader=false; render(); return; }
    modal({title:t("leaderTitle"),text:t("leaderText"),
      input:{type:"password",placeholder:t("passPh"),cap:"off",max:30},okLabel:t("open"),
      onOk:function(v){ if(v!==state.cfg.password) return t("wrongPass"); ui.leader=true; render(); }});
  });

  tick(); render();
  setInterval(function(){
    tick();
    if(document.querySelector(".overlay") || ui.leader) return;
    render();
  }, 30000);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){ tick(); if(!document.querySelector(".overlay") && !ui.leader) render(); }
  });
})();
</script>
</body>
